<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- XWork Technologies Corporate / ORG Master Mark -->
  <!-- Squircle Outer Base: Obsidian Navy -->
  <rect width="512" height="512" rx="136" fill="#0F172A"/>
  <!-- 2x2 Interlocking Tile Matrix (Corner Radius = 44px) -->
  <!-- Top-Left: Pure White -->
  <rect x="88" y="88" width="152" height="152" rx="44" fill="#FFFFFF"/>
  <!-- Top-Right: Electric Cyan -->
  <rect x="272" y="88" width="152" height="152" rx="44" fill="#38BDF8"/>
  <!-- Bottom-Left: Electric Cyan -->
  <rect x="88" y="272" width="152" height="152" rx="44" fill="#38BDF8"/>
  <!-- Bottom-Right: Pure White -->
  <rect x="272" y="272" width="152" height="152" rx="44" fill="#FFFFFF"/>
</svg>
