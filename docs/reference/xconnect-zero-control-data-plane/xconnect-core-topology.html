  <script>
    const buttons = document.querySelectorAll('.layer-btn');
    const nodes = document.querySelectorAll('.node');
    const edges = document.querySelectorAll('.edge, .edge-label');

    function setLayer(selected) {
      buttons.forEach(btn => {
        const active = btn.dataset.layer === selected;
        btn.className = active
          ? 'layer-btn px-3 py-1.5 rounded-md border border-[var(--primary)] bg-[var(--primary)] text-[var(--primary-foreground)] font-medium'
          : 'layer-btn px-3 py-1.5 rounded-md border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)]';
      });
      nodes.forEach(el => {
        const layers = (el.dataset.layers || '').split(',');
        el.style.opacity = (selected === 'all' || layers.includes(selected)) ? '1' : '0.18';
      });
      edges.forEach(el => {
        const layers = (el.dataset.layers || '').split(',');
        el.style.opacity = (selected === 'all' || layers.includes(selected)) ? '1' : '0.12';
      });
    }

    buttons.forEach(btn => btn.addEventListener('click', () => setLayer(btn.dataset.layer)));
  </script>
