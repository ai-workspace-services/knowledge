apiVersion: content.xworkmate.com/v1alpha1
kind: WebsiteContent
metadata:
  name: portal
spec:
  schemaVersion: 1
  locales:
    - zh
    - en
  entrypoints:
    discovery:
      - discovery.json
    operations:
      - operations/zh/hero.md
      - operations/en/hero.md
    homepageMarketing:
      - homepage/zh/marketing.md
      - homepage/en/marketing.md
    homepageHero:
      - homepage/zh/hero.md
      - homepage/en/hero.md
    products:
      - product/global-mesh/zh/hero.md
      - product/global-mesh/en/hero.md
      - product/xconnect/zh/hero.md
      - product/xconnect/en/hero.md
      - product/xworkmate/zh/hero.md
      - product/xworkmate/en/hero.md
      - product/open-platform/zh/hero.md
      - product/open-platform/en/hero.md
      - product/ai-workspace/zh/hero.md
      - product/ai-workspace/en/hero.md
      - product/xcloudflow/zh/hero.md
      - product/xcloudflow/en/hero.md
      - product/xscopehub/zh/hero.md
      - product/xscopehub/en/hero.md
      - product/xstream/zh/hero.md
      - product/xstream/en/hero.md
    billingPolicy:
      - account/billing-policy/zh.json
      - account/billing-policy/en.json
    emailPreferences:
      - account/email-preferences/zh.json
      - account/email-preferences/en.json
    referral:
      - campaign/referral/zh.json
      - campaign/referral/en.json
  consumer:
    repository: portal
    targetPath: src/content
